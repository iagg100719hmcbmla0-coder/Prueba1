<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>
            Suma 2 Números
        </title>
    </head>
    <body>
        <center>
            <h1>Suma de dos Números "Flask y sus amigos"</h1>
            <hr>
            <input type="number" id="num1" placeholder="Número 1">
            <input type="number" id="num2" placeholder="Número 2">
            <!--
            El input significa entrada de datos por parte del usuario
            typy: puede ser texto, en este caso es un número lo que se espera.
            id: es un identificador único para que lo reconozca JS
            placeholder: muestra un texto guía para el usuario
            -->
            <button onclick="sumar()">Sumar</button>
            <!--
            Se crea un botón para realizar la suma al momento de dar clic.
            se ejecuta una funcióin en JS llamado sumar()
            -->
            <h2 id="resultado"></h2>
            <!--
            id es un identificador único
            -->
            <script src="{{url_for('static',filename='script.js')}}"></script>
            <!--
            Indica la ruta en donde se encuentra el archivo JS, para
            las operaciones y variables de la suma-->
        </center>
    </body>
</html>
